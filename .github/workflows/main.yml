name: Build macOS Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Tải mã nguồn về
      uses: actions/checkout@v4

    - name: Cài đặt .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build & Publish bản CLI cho macOS (Apple Silicon & Intel)
      run: |
        dotnet publish KittyDy0Launcher.Cli/KittyDy0Launcher.Cli.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o ./publish-arm64
        dotnet publish KittyDy0Launcher.Cli/KittyDy0Launcher.Cli.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o ./publish-x64

    - name: Cấp quyền thực thi và đóng gói ZIP
      run: |
        chmod +x ./publish-arm64/kittydy0
        chmod +x ./publish-x64/kittydy0
        zip -r KittyDy0Launcher-macOS-arm64.zip ./publish-arm64
        zip -r KittyDy0Launcher-macOS-x64.zip ./publish-x64

    - name: Xuất file thành phẩm (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: KittyDy0Launcher-macOS-Builds
        path: |
          KittyDy0Launcher-macOS-arm64.zip
          KittyDy0Launcher-macOS-x64.zip
