name: Build macOS Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Tải mã nguồn về
      uses: actions/checkout@v4

    - name: Cài đặt .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Chuyển đổi icon.png sang chuẩn .icns
      run: |
        if [ -f "KittyDy0Launcher/Assets/icon.png" ]; then
          mkdir -p AppIcon.iconset
          sips -z 16 16     KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 KittyDy0Launcher/Assets/icon.png --out AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o AppIcon.icns
          rm -rf AppIcon.iconset
        fi

    - name: Build & đóng gói tuần tự từng kiến trúc (tiết kiệm dung lượng)
      run: |
        for ARCH in arm64 x64; do
          dotnet publish KittyDy0Launcher.Cli/KittyDy0Launcher.Cli.csproj -c Release -r osx-$ARCH --self-contained true -p:PublishSingleFile=true -o ./publish-$ARCH

          APP_DIR="dmg-$ARCH/KittyDy0Launcher.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"

          cp "./publish-$ARCH/kittydy0" "$APP_DIR/Contents/MacOS/kittydy0-bin"
          chmod +x "$APP_DIR/Contents/MacOS/kittydy0-bin"
          rm -rf "./publish-$ARCH"

          if [ -f "AppIcon.icns" ]; then
            cp "AppIcon.icns" "$APP_DIR/Contents/Resources/AppIcon.icns"
          fi

          cat << 'EOF' > "$APP_DIR/Contents/MacOS/KittyDy0Launcher"
        #!/bin/bash
        DIR="$(cd "$(dirname "$0")" && pwd)"
        osascript -e "tell application \"Terminal\" to do script \"'$DIR/kittydy0-bin'\""
        osascript -e 'tell application "Terminal" to activate'
        EOF
          chmod +x "$APP_DIR/Contents/MacOS/KittyDy0Launcher"

          cat << 'EOF' > "$APP_DIR/Contents/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleExecutable</key>
          <string>KittyDy0Launcher</string>
          <key>CFBundleIconFile</key>
          <string>AppIcon</string>
          <key>CFBundleIdentifier</key>
          <string>com.kittydy0.launcher</string>
          <key>CFBundleName</key>
          <string>KittyDy0Launcher</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>1.0</string>
        </dict>
        </plist>
        EOF

          codesign --force --deep --sign - "$APP_DIR"
          ln -s /Applications "dmg-$ARCH/Applications"

          hdiutil create -volname "KittyDy0Launcher-$ARCH" -srcfolder "dmg-$ARCH" -ov -format UDZO "KittyDy0Launcher-macOS-$ARCH.dmg"

          # Dọn sạch thư mục tạm ngay sau khi nén xong từng bản DMG
          rm -rf "dmg-$ARCH" KittyDy0Launcher.Cli/bin KittyDy0Launcher.Cli/obj KittyDy0Launcher.Core/bin KittyDy0Launcher.Core/obj
        done

    - name: Xuất file .dmg (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: KittyDy0Launcher-macOS-DMG
        path: |
          KittyDy0Launcher-macOS-arm64.dmg
          KittyDy0Launcher-macOS-x64.dmg
